<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SVL Operator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>SVL Operator</h2>
<form id="targetForm">
  <input id="tname" placeholder="Target Name"><br>
  <textarea id="tdesc" placeholder="Description"></textarea><br>
  <input id="lat" placeholder="Latitude"><br>
  <input id="lng" placeholder="Longitude"><br>
  <select id="priority">
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
  </select><br>
  <input type="file" id="photo"><br>
  <button type="submit">Add Target</button>
</form>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>
<script src="firebase.js"></script>
<script src="svl.js"></script>
</body>
</html>
