<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>SVL Operator</title></head>
<body>
<h2>SVL Operator</h2>
<input id="name" placeholder="Target Name"><br><br>
<textarea id="desc" placeholder="Description"></textarea><br><br>
<input id="lat" placeholder="Latitude"><br><br>
<input id="lng" placeholder="Longitude"><br><br>
<select id="priority">
  <option>High</option>
  <option>Medium</option>
  <option>Low</option>
</select><br><br>
<input type="file" id="photo" accept="image/*"><br><br>
<button onclick="submitTarget()">Submit Target</button>
<script src="svl.js"></script>
</body>
</html>
